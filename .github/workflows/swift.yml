name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: test (macOS, all traits)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'
      - name: Build and test
        run: swift test --enable-all-traits

  linux:
    name: test (Linux, all traits)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.3.3

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build and test
        run: swift test --enable-all-traits

  mlt-swift-macos:
    name: MLT pure Swift (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'
      - name: Build and test pure Swift MLT
        run: swift test --traits EnableMLT

  mlt-swift-linux:
    name: MLT pure Swift (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.3.3
    env:
      MLT_FULL_CORPUS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build and test pure Swift MLT
        run: swift test --traits EnableMLT

  mlt-swift-clean:
    name: MLT pure Swift without submodules (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build the executable without C++ sources
        run: swift build --traits EnableMLT --product mvt

  consumer-traits:
    name: consumer traits (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build a package that enables only some traits
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/consumer
          mkdir -p "$consumer/Sources/Consumer"
          printf 'import MVTTools\n' > "$consumer/Sources/Consumer/Consumer.swift"
          for traits in '"EnableMVT"' '"EnableMLT"' '"EnableCSV"' '"EnableMVT", "EnableMLT"'; do
            cat > "$consumer/Package.swift" <<EOF
          // swift-tools-version: 6.3
          import PackageDescription

          let package = Package(
              name: "Consumer",
              dependencies: [
                  .package(path: "$GITHUB_WORKSPACE", traits: [$traits]),
              ],
              targets: [
                  .target(
                      name: "Consumer",
                      dependencies: [.product(name: "MVTTools", package: "mvt-tools")]),
              ])
          EOF
            echo "Building with traits: $traits"
            swift build --package-path "$consumer"
          done

  watchos:
    name: build (watchOS, MLT)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'
      - name: Build MVTTools for watchOS
        run: |
          swift build \
            --target MVTTools \
            --traits EnableMVT,EnableMLT \
            --triple arm64_32-apple-watchos9.0 \
            --sdk "$(xcrun --sdk watchos --show-sdk-path)"

  mlt-cxx:
    name: MLT C++ backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test C++ MLT backend
        run: swift test --traits EnableMLTCXX

  mlt-sanitizers:
    name: MLT sanitizers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3.3
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build the benchmark executable
        run: swift build --traits EnableMLT --product mlt-benchmark
      - name: Test with AddressSanitizer
        run: swift test --traits EnableMLT --sanitize=address --filter 'MLTCoreTests|MLTRoundtrip|MLTDecoderTests|MLTEncoderRingClosureTests|MLTCrossBackendTests'

  coverage:
    name: coverage (Linux, all non-C++ traits)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.3.3

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite development files
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Run tests with coverage
        run: swift test --traits EnableMVT,EnableMLT,EnableCSV,EnableFIT,EnableGPX,EnableShapefile,EnableGeoPackage --enable-code-coverage
      - name: Ensure Python
        run: command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)
      - name: Report library coverage
        run: python3 scripts/coverage.py --minimum 90 | tee coverage-report.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.txt
          if-no-files-found: ignore

  docc:
    name: documentation (DocC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3.3

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ensure Python
        run: command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)
      - name: Build and validate DocC catalog
        run: python3 scripts/check_documentation.py
