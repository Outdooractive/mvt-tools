name: Homebrew

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The git tag name to bump the formula to'
        required: true

jobs:
  homebrew:
    name: Bump Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          submodules: recursive
      - name: Update the CLI version
        run: echo "public let cliVersion = \"${CLI_VERSION}\"" > Sources/MVTCLI/Version.swift
        env:
          CLI_VERSION: ${{ inputs.tag_name }}
      - name: Build the executable for release
        run: |
          # macos-latest is arm64, but we cross-compile for x86_64 too.
          # The CSQLite system-library bridge resolves via pkg-config to
          # Homebrew's arm64-only sqlite3. The macOS system SQLite at
          # /usr/lib/libsqlite3.dylib is universal (arm64+x86_64), so we
          # shadow Homebrew's pkg-config file with one pointing at the SDK.
          SDK="$(xcrun --show-sdk-path)"
          PC_DIR="$(mktemp -d)"
          {
            printf 'prefix=%s/usr\n' "$SDK"
            printf 'exec_prefix=${prefix}\n'
            printf 'libdir=/usr/lib\n'
            printf 'includedir=${prefix}/include\n'
            printf 'Name: SQLite\n'
            printf 'Description: SQLite database engine (system, universal)\n'
            printf 'Version: 3.0.0\n'
            printf 'Libs: -L${libdir} -lsqlite3\n'
            printf 'Cflags: -I${includedir}\n'
          } > "$PC_DIR/sqlite3.pc"
          export PKG_CONFIG_PATH="$PC_DIR:${PKG_CONFIG_PATH:-}"
          swift build -c release --arch arm64 --arch x86_64 --product mvt
      - name: Compress the archive
        run: tar -czf mvt.tar.gz -C .build/apple/Products/Release mvt
      - name: Upload the release attachment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.payload.inputs.tag_name;
            console.log("tag = ", tag);
            // Get release for this tag
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            // Upload the release asset
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: "mvt.tar.gz",
              data: await fs.readFileSync("mvt.tar.gz")
            })
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: mvt-tools
          homebrew-tap: Outdooractive/homebrew-tap
          tag-name: ${{ inputs.tag_name }}
          download-url: https://github.com/Outdooractive/mvt-tools/releases/download/${{ inputs.tag_name }}/mvt.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
